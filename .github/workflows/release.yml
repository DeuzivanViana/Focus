name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/release.jks"
          # Tolerate line breaks or spaces pasted into the secret.
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE"
          echo "RELEASE_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          FOCUS_BACKUP_KEY: ${{ secrets.FOCUS_BACKUP_KEY }}
        run: |
          for v in RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set."; exit 1; fi
          done
          if [ -z "$FOCUS_BACKUP_KEY" ]; then
            echo "::warning::FOCUS_BACKUP_KEY is not set: this build uses the public development backup key."
          fi
          ./gradlew --no-configuration-cache assembleRelease bundleRelease

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -n1)
          echo "APK: $APK"
          echo "AAB: $AAB"
          case "$APK" in *unsigned*) echo "::error::APK is unsigned (signing secrets not picked up)."; exit 1;; esac
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          echo "apksigner from $BT"
          # Print the full result; apksigner exits non-zero if the APK does not verify.
          "$BT/apksigner" verify --print-certs "$APK" || { echo "::error::APK signature does not verify."; exit 1; }
          # jarsigner always exits 0 on an unsigned jar, so check its message instead.
          OUT=$(jarsigner -verify "$AAB" 2>&1 || true)
          echo "$OUT" | tail -n 5
          if ! echo "$OUT" | grep -q "jar verified"; then
            echo "::error::AAB signature does not verify."; exit 1
          fi

      - name: Rename outputs
        id: out
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp "$(ls app/build/outputs/apk/release/*.apk | head -n1)" "dist/focus-$VERSION-release.apk"
          cp "$(ls app/build/outputs/bundle/release/*.aab | head -n1)" "dist/focus-$VERSION-release.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: focus-${{ steps.out.outputs.version }}-release
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
